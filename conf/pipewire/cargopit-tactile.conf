# Cargopit tactile correction: PipeWire filter-chain virtual sink.
# Generated by tools/haptics/fr_to_filterchain.py from cargopit-rig-measurement.csv.
# 5 peaking filters, max fit error 0.95 dB over 10.00-190.00 Hz.
# Do not edit the eq nodes by hand; re-run the generator with your own sweep.
#
# Install: copy to ~/.config/pipewire/pipewire.conf.d/ and set
# target.object to your tactile amplifier sink (pactl list short sinks),
# then restart PipeWire. Point cargopit Sound devices at the sink name below.
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Cargopit tactile correction"
            media.name       = "Cargopit tactile correction"
            filter.graph = {
                nodes = [
                    # highpass 10.00 Hz, Butterworth
                    { type = builtin name = highpass label = bq_raw
                      config = { coefficients = [
                            { rate = 44100, b0=0.999999492516, b1=-1.99999898503, b2=0.999999492516, a0=1.00100745611, a1=-1.99999797006, a2=0.998992543892 }
                            { rate = 48000, b0=0.999999571632, b1=-1.99999914326, b2=0.999999571632, a0=1.00092560035, a1=-1.99999828653, a2=0.999074399652 }
                            { rate = 88200, b0=0.999999873129, b1=-1.99999974626, b2=0.999999873129, a0=1.00050372818, a1=-1.99999949252, a2=0.999496271818 }
                            { rate = 96000, b0=0.999999892908, b1=-1.99999978582, b2=0.999999892908, a0=1.00046280027, a1=-1.99999957163, a2=0.999537199727 }
                            { rate = 176400, b0=0.999999968282, b1=-1.99999993656, b2=0.999999968282, a0=1.00025186411, a1=-1.99999987313, a2=0.999748135893 }
                            { rate = 192000, b0=0.999999973227, b1=-1.99999994645, b2=0.999999973227, a0=1.00023140015, a1=-1.99999989291, a2=0.999768599851 }
                      ] } }
                    { type = builtin name = eq1 label = bq_peaking control = { "Freq" = 37.48 "Q" = 7.85 "Gain" = -3.96 } }
                    { type = builtin name = eq2 label = bq_peaking control = { "Freq" = 40.99 "Q" = 7.19 "Gain" = -8.21 } }
                    { type = builtin name = eq3 label = bq_peaking control = { "Freq" = 45.09 "Q" = 7.93 "Gain" = -6.81 } }
                    { type = builtin name = eq4 label = bq_peaking control = { "Freq" = 47.98 "Q" = 10.00 "Gain" = -1.27 } }
                    { type = builtin name = eq5 label = bq_peaking control = { "Freq" = 139.36 "Q" = 5.84 "Gain" = -2.32 } }
                    # lowpass 120.00 Hz, Butterworth
                    { type = builtin name = lowpass label = bq_raw
                      config = { coefficients = [
                            { rate = 44100, b0=7.3075951593e-05, b1=0.000146151903186, b2=7.3075951593e-05, a0=1.01208888841, a1=-1.99970769619, a2=0.98791111159 }
                            { rate = 48000, b0=6.16837591697e-05, b1=0.000123367518339, b2=6.16837591697e-05, a0=1.01110675059, a1=-1.99975326496, a2=0.988893249415 }
                            { rate = 88200, b0=1.82693216664e-05, b1=3.65386433328e-05, b2=1.82693216664e-05, a0=1.00604466507, a1=-1.99992692271, a2=0.993955334931 }
                            { rate = 96000, b0=1.54211776052e-05, b1=3.08423552103e-05, b2=1.54211776052e-05, a0=1.00555354658, a1=-1.99993831529, a2=0.994446453423 }
                            { rate = 176400, b0=4.5673512773e-06, b1=9.13470255459e-06, b2=4.5673512773e-06, a0=1.00302236014, a1=-1.99998173059, a2=0.996977639857 }
                            { rate = 192000, b0=3.85530926472e-06, b1=7.71061852944e-06, b2=3.85530926472e-06, a0=1.0027767947, a1=-1.99998457876, a2=0.997223205301 }
                      ] } }
                    { type = builtin name = ceiling label = clamp control = { "Min" = -0.50 "Max" = 0.50 } }
                ]
                links = [
                    { output = "highpass:Out" input = "eq1:In" }
                    { output = "eq1:Out" input = "eq2:In" }
                    { output = "eq2:Out" input = "eq3:In" }
                    { output = "eq3:Out" input = "eq4:In" }
                    { output = "eq4:Out" input = "eq5:In" }
                    { output = "eq5:Out" input = "lowpass:In" }
                    { output = "lowpass:Out" input = "ceiling:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "cargopit_tactile"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name      = "cargopit_tactile.output"
                node.passive   = true
                target.object  = "alsa_output.REPLACE_WITH_TACTILE_AMP"
                # WirePlumber 0.5+: stay unlinked instead of falling back to the
                # default sink when target.object is missing. Do not add
                # node.dont-reconnect: WirePlumber destroys the stream if it is
                # handled before the amplifier sink appears, e.g. at login.
                node.dont-fallback = true
            }
        }
    }
]
