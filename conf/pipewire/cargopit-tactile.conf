# Cargopit tactile correction: PipeWire filter-chain virtual sink.
# Generated by tools/haptics/fr_to_filterchain.py from cargopit-rig-measurement.csv.
# 5 peaking filters, max fit error 0.95 dB over 10.00-190.00 Hz.
# Do not edit the eq nodes by hand; re-run the generator with your own sweep.
#
# Install: copy to ~/.config/pipewire/pipewire.conf.d/ and set
# target.object to your tactile amplifier sink (pactl list short sinks),
# then restart PipeWire. Point cargopit Sound devices at the sink name below.
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Cargopit tactile correction"
            media.name       = "Cargopit tactile correction"
            filter.graph = {
                nodes = [
                    { type = builtin name = highpass label = bq_highpass control = { "Freq" = 10.00 "Q" = 0.71 } }
                    { type = builtin name = eq1 label = bq_peaking control = { "Freq" = 37.48 "Q" = 7.85 "Gain" = -3.96 } }
                    { type = builtin name = eq2 label = bq_peaking control = { "Freq" = 40.99 "Q" = 7.19 "Gain" = -8.21 } }
                    { type = builtin name = eq3 label = bq_peaking control = { "Freq" = 45.09 "Q" = 7.93 "Gain" = -6.81 } }
                    { type = builtin name = eq4 label = bq_peaking control = { "Freq" = 47.98 "Q" = 10.00 "Gain" = -1.27 } }
                    { type = builtin name = eq5 label = bq_peaking control = { "Freq" = 139.36 "Q" = 5.84 "Gain" = -2.32 } }
                    { type = builtin name = lowpass label = bq_lowpass control = { "Freq" = 120.00 "Q" = 0.71 } }
                    { type = builtin name = ceiling label = clamp control = { "Min" = -0.50 "Max" = 0.50 } }
                ]
                links = [
                    { output = "highpass:Out" input = "eq1:In" }
                    { output = "eq1:Out" input = "eq2:In" }
                    { output = "eq2:Out" input = "eq3:In" }
                    { output = "eq3:Out" input = "eq4:In" }
                    { output = "eq4:Out" input = "eq5:In" }
                    { output = "eq5:Out" input = "lowpass:In" }
                    { output = "lowpass:Out" input = "ceiling:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "cargopit_tactile"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name      = "cargopit_tactile.output"
                node.passive   = true
                target.object  = "alsa_output.REPLACE_WITH_TACTILE_AMP"
                # Stay silent instead of falling back to desktop speakers.
                node.dont-fallback  = true
                node.dont-reconnect = true
            }
        }
    }
]
