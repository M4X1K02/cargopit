name: installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - install.sh
      - tools/uninstall.sh
      - tui/**
      - tools/distro/**
      - README.md
      - HOW-TO-USE.md
      - udev/**
      - conf/cargopit.config
      - .github/workflows/installer.yml
  push:
    paths:
      - install.sh
      - tools/uninstall.sh
      - tui/**
      - tools/distro/**
      - README.md
      - HOW-TO-USE.md
      - udev/**
      - conf/cargopit.config
      - .github/workflows/installer.yml

permissions:
  contents: read

# `runner` is a job/step context. Putting `${{ runner.temp }}` in workflow-level
# env made GitHub reject the file ("Unrecognized named-value: 'runner'") so
# every installer run finished in 0s with zero jobs. This path is the same
# fallback tools/distro/test-install-containers.sh uses when INSTALLER_LOG_DIR
# and TMPDIR are unset.
env:
  INSTALLER_LOG_DIR: /tmp/cargopit-install-tests

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash tools/distro/test-install-containers.sh syntax

  detect:
    needs: syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [archlinux, fedora, ubuntu, debian]
    steps:
      - uses: actions/checkout@v4
      - name: Distro family detection
        run: bash tools/distro/test-install-containers.sh detect ${{ matrix.name }}
      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-detect-${{ matrix.name }}
          path: ${{ env.INSTALLER_LOG_DIR }}
          if-no-files-found: warn
          retention-days: 7

  detect-edge:
    needs: syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nobara / Mint / Bazzite os-release mocks
        run: bash tools/distro/test-install-containers.sh mocks
      - name: Immutable distros refuse host install
        run: bash tools/distro/test-install-containers.sh immutable
      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-detect-edge
          path: ${{ env.INSTALLER_LOG_DIR }}
          if-no-files-found: warn
          retention-days: 7

  install:
    needs: syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [archlinux, fedora, ubuntu]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Full source install (${{ matrix.name }})
        run: bash tools/distro/test-install-containers.sh full ${{ matrix.name }}
      - name: Installer log on failure
        if: failure()
        run: |
          log="${INSTALLER_LOG_DIR}/${{ matrix.name }}.full.log"
          if [ -f "$log" ]; then
            tail -n 120 "$log"
          fi
      - name: Upload installer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: installer-full-${{ matrix.name }}
          path: ${{ env.INSTALLER_LOG_DIR }}
          if-no-files-found: warn
          retention-days: 7
