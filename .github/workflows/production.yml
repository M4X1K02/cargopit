# Registers GitHub Actions deployment environments that rulesets can
# require (Settings → Environments, or a ruleset's "Required deployments").
#
# Names come from .github/deployment-environments.json so the Linux package
# targets in ci.yaml and this workflow stay the same list. GitHub creates
# each environment the first time a job with `environment:` runs for that
# name. The Environments REST API is not available to every token.
#
# GitHub does not expand the `env` context in a job's `environment` key;
# the matrix value is passed through an expression instead.

name: Deployment environments

on:
  pull_request:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  load-environment-names:
    name: Load environment names
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.load.outputs.names }}
    steps:
      - uses: actions/checkout@v4
      - name: Read deployment environment names
        id: load
        env:
          DEPLOYMENT_ENVIRONMENTS_FILE: .github/deployment-environments.json
          DEPLOYMENT_ENVIRONMENTS_KEY: environments
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          spec_path = Path(os.environ["DEPLOYMENT_ENVIRONMENTS_FILE"])
          names_key = os.environ["DEPLOYMENT_ENVIRONMENTS_KEY"]
          if not spec_path.is_file():
              raise SystemExit(f"missing {spec_path}")

          spec = json.loads(spec_path.read_text(encoding="utf-8"))
          names = spec.get(names_key)
          if not isinstance(names, list) or not names:
              raise SystemExit(f"{spec_path} has no {names_key} list")
          if any(not isinstance(name, str) or not name.strip() for name in names):
              raise SystemExit(f"{spec_path} {names_key} must be non-empty strings")

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output_file:
              output_file.write("names=" + json.dumps(names) + "\n")
          PY

  record-deployment:
    name: Record ${{ matrix.github_environment }} deployment
    needs: load-environment-names
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        github_environment: ${{ fromJson(needs.load-environment-names.outputs.names) }}
    environment:
      name: ${{ matrix.github_environment }}
    steps:
      - name: Confirm deployment environment
        env:
          CARGOPIT_GITHUB_ENVIRONMENT: ${{ matrix.github_environment }}
        run: |
          printf '%s\n' \
            "environment=${CARGOPIT_GITHUB_ENVIRONMENT}" \
            "ref=${GITHUB_REF}" \
            "sha=${GITHUB_SHA}"
