name: PR Build & Test

on:
  pull_request:
  push:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Update apt
        run: sudo apt update
      - name: Install dependencies
        run: sudo apt install -y cmake pkg-config build-essential libserialport-dev libhidapi-dev liblua5.4-dev libpulse-dev libproc2-dev libclang-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure CMake
        run: cmake -B build -DENABLE_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --config Debug
      - name: Run tests
        run: ctest --test-dir build --output-on-failure --timeout 300
      - name: Reject unmarked golden edits
        run: bash tests/parity/check-golden-edits.sh origin/master

  rust-static-analysis:
    name: Rust static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install simapi-sys build dependencies
        run: sudo apt update && sudo apt install -y build-essential pkg-config libproc2-dev libclang-dev libhidapi-dev liblua5.4-dev libpulse-dev libudev-dev libserialport-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Run Rust static analysis
        run: bash tools/rust-static-analysis.sh
