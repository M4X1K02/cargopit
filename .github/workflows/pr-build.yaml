name: PR Build & Test

on:
  pull_request:
  push:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Update apt
        run: sudo apt update
      - name: Install dependencies
        # Same C/system list as ci.yaml's ubuntu-latest leg. cargo/rustc come
        # from rust-toolchain below: Ubuntu's packages are too old for
        # tui/Cargo.toml rust-version (1.88+).
        run: sudo apt install -y cmake pkg-config build-essential libuv1-dev libargtable2-dev libserialport-dev libconfig-dev libhidapi-dev liblua5.4-dev libxdg-basedir-dev libxml2-dev libpulse-dev libproc2-dev libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure CMake
        run: cmake -B build -DENABLE_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --config Debug
      - name: Run tests
        run: ctest --test-dir build --output-on-failure --timeout 30
      - name: TUI tests
        run: cargo test --manifest-path tui/Cargo.toml --target-dir build/tui

  parity-harness:
    name: Rust port parity harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Update apt
        run: sudo apt update
      - name: Install dependencies
        run: sudo apt install -y cmake pkg-config build-essential libuv1-dev libargtable2-dev libserialport-dev libconfig-dev libhidapi-dev liblua5.4-dev libxdg-basedir-dev libxml2-dev libpulse-dev libproc2-dev libclang-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure and build the C capture harness
        run: cmake -B build -DENABLE_TESTS=ON -DCMAKE_BUILD_TYPE=Debug && cmake --build build --target parity_c_capture uhid_probe
      - name: Clock grep check
        run: bash tests/parity/check-clock.sh
      - name: UHID capability probe
        run: ./build/tests/parity/uhid_probe
      - name: Scenario and layout tests
        run: cargo test --workspace --exclude cargopit-tui
      - name: C capture self-check
        run: ctest --test-dir build -R 'parity_self_check|uhid_probe' --output-on-failure --timeout 120
      - name: Golden files match a fresh C capture
        run: bash tests/parity/verify-goldens.sh
      - name: Reject unmarked golden edits
        run: bash tests/parity/check-golden-edits.sh origin/master

  rust-static-analysis:
    name: Rust static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install simapi-sys build dependencies
        run: sudo apt update && sudo apt install -y build-essential pkg-config libproc2-dev libclang-dev libhidapi-dev liblua5.4-dev libpulse-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Run Rust static analysis
        run: bash tools/rust-static-analysis.sh

  static-analysis:
    name: Legacy C static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Update apt
        run: sudo apt update
      - name: Install C dependencies
        run: sudo apt install -y cmake pkg-config build-essential libuv1-dev libargtable2-dev libserialport-dev libconfig-dev libhidapi-dev liblua5.4-dev libxdg-basedir-dev libxml2-dev libpulse-dev libproc2-dev libclang-dev
      - name: Run static analysis
        run: bash tools/static-analysis.sh --ci --build-dir build/static-analysis
