name: PR Build & Test

on:
  pull_request:
  push:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Update apt
        run: sudo apt update
      - name: Install dependencies
        # Same C/system list as ci.yaml's ubuntu-latest leg. cargo/rustc come
        # from rust-toolchain below: Ubuntu's packages are too old for
        # tui/Cargo.toml rust-version (1.88+).
        run: sudo apt install -y cmake pkg-config build-essential libuv1-dev libargtable2-dev libserialport-dev libconfig-dev libhidapi-dev liblua5.4-dev libxdg-basedir-dev libxml2-dev libpulse-dev libproc2-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Configure CMake
        run: cmake -B build -DENABLE_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --config Debug
      - name: Run tests
        run: ctest --test-dir build --output-on-failure --timeout 30
      - name: TUI tests
        run: cargo test --manifest-path tui/Cargo.toml --target-dir build/tui

  static-analysis:
    name: Legacy C static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Update apt
        run: sudo apt update
      - name: Install C dependencies
        run: sudo apt install -y cmake pkg-config build-essential libuv1-dev libargtable2-dev libserialport-dev libconfig-dev libhidapi-dev liblua5.4-dev libxdg-basedir-dev libxml2-dev libpulse-dev libproc2-dev
      - name: Run static analysis
        run: bash tools/static-analysis.sh --ci --build-dir build/static-analysis
